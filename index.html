<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BBC · Panel de Herramientas</title>
<style>
  :root{
    --bg:#f7f3e9;
    --card:#ffffff;
    --border:#e7e1d2;
    --text-primary:#1a1a18;
    --text-secondary:#6b6558;
    --muted:#948d7c;
    --shadow:0 1px 2px rgba(20,18,10,0.04), 0 8px 24px -12px rgba(20,18,10,0.15);
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text-primary);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:720px;margin:0 auto;padding:56px 20px 80px}

  header{text-align:center;margin-bottom:40px}
  header .logo-img{
    display:block;margin:0 auto 18px;height:auto;width:220px;max-width:70%;
  }
  header h1{margin:0 0 8px;font-size:28px;font-weight:700;letter-spacing:-0.01em}
  header p{margin:0;color:var(--text-secondary);font-size:15px}

  .section-label{
    font-size:12.5px;font-weight:700;letter-spacing:0.04em;color:var(--muted);
    text-transform:uppercase;margin:0 4px 14px;
  }

  .modules{display:flex;flex-direction:column;gap:14px}

  .module-card{
    display:flex;align-items:center;gap:18px;
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px 22px;text-decoration:none;color:inherit;
    box-shadow:var(--shadow);
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .module-card:hover{
    transform:translateY(-2px);
    border-color:#d8d0ba;
    box-shadow:0 2px 4px rgba(20,18,10,0.06), 0 14px 32px -14px rgba(20,18,10,0.22);
  }
  .module-card .icon{
    flex-shrink:0;width:52px;height:52px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:24px;
  }
  .module-card .content{flex:1;min-width:0}
  .module-card h2{margin:0 0 4px;font-size:17px;font-weight:650;letter-spacing:-0.005em}
  .module-card .desc{margin:0 0 10px;font-size:13.5px;color:var(--text-secondary);line-height:1.4}
  .tag{
    display:inline-block;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:99px;
  }
  .module-card .chevron{flex-shrink:0;color:var(--muted);font-size:20px}

  footer{text-align:center;margin-top:48px;color:var(--muted);font-size:12.5px}

  @media(max-width:480px){
    .module-card{padding:16px}
    .module-card .icon{width:44px;height:44px;font-size:20px}
  }
</style>
</head>

    url: "https://alejom19.github.io/PANEL-HERRAMIENTAS-COMPRAS/"
  },
  {
    title: "Inventarios",
    desc: "Conteo, diferencias y cierre de inventarios mensuales.",
    tag: "Área",
    tagColor: "amber",
    icon: "📦",
    url: "https://alejom19.github.io/HERRAMIENTA-INVENTARIOS/"
  }
];

const COLORS = {
  teal:   { bg:"#e3f3ea", text:"#1c7a4c", tag:"#e3f3ea", tagText:"#1c7a4c" },
  blue:   { bg:"#e5eefc", text:"#2a5fb0", tag:"#e5eefc", tagText:"#2a5fb0" },
  amber:  { bg:"#fdf1e0", text:"#a1660a", tag:"#fdf1e0", tagText:"#a1660a" },
  purple: { bg:"#f0e9fb", text:"#6b3fb0", tag:"#f0e9fb", tagText:"#6b3fb0" },
  rose:   { bg:"#fbe9ee", text:"#b0396b", tag:"#fbe9ee", tagText:"#b0396b" }
};

const container = document.getElementById("modules");

MODULES.forEach(mod => {
  const c = COLORS[mod.tagColor] || COLORS.teal;
  const a = document.createElement("a");
  a.className = "module-card";
  a.href = mod.url;
  a.target = "_self";
  a.innerHTML = `
    <div class="icon" style="background:${c.bg};color:${c.text}">${mod.icon}</div>
    <div class="content">
      <h2>${mod.title}</h2>
      <p class="desc">${mod.desc}</p>
      <span class="tag" style="background:${c.tag};color:${c.tagText}">${mod.tag}</span>
    </div>
    <div class="chevron">›</div>
  `;
  container.appendChild(a);
});
</script>
</body>
</html>
